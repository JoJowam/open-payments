<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Criar Configuração</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-main: #050505;
        --bg-card: #101a10;
        --border-hacker: #00ff41;
        --text-hacker: #00ff41;
        --text-main: #c8ffc8;
        --radius: 14px;
        --shadow: 0 0 16px #00ff4166, 0 0 2px #00ff41;
        --scanline: repeating-linear-gradient(
          to bottom,
          transparent 0px,
          transparent 2px,
          rgba(0, 255, 65, 0.04) 3px,
          transparent 4px,
          transparent 7px
        );
      }

      body {
        min-height: 100vh;
        margin: 0;
        background: var(--bg-main);
        color: var(--text-main);
        font-family: 'Fira Mono', 'Consolas', 'Menlo', monospace;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
      }

      body::before {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 10;
        background: var(--scanline);
        opacity: 0.7;
        mix-blend-mode: lighten;
        animation: scanmove 4s linear infinite;
      }
      @keyframes scanmove {
        0% {
          background-position-y: 0;
        }
        100% {
          background-position-y: 20px;
        }
      }

      .container {
        background: linear-gradient(135deg, #0a120a 80%, #0d2f0d 100%);
        border: 2.5px solid var(--border-hacker);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 42px 38px 34px 38px;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-width: 320px;
        max-width: 430px;
        width: 100%;
        position: relative;
        z-index: 1;
        overflow: hidden;
        animation: border-glow 2.5s infinite alternate;
      }
      @keyframes border-glow {
        from {
          box-shadow:
            0 0 10px #00ff41,
            0 0 2px #00ff41;
        }
        to {
          box-shadow:
            0 0 32px #00ff41,
            0 0 8px #00ff41;
        }
      }

      .terminal-bar {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 7px;
        margin-bottom: 18px;
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #00ff41;
        box-shadow: 0 0 6px #00ff41cc;
        opacity: 0.8;
        animation: blink 1.2s infinite alternate;
      }
      .dot:nth-child(2) {
        background: #222;
        box-shadow: none;
        animation: none;
      }
      .dot:nth-child(3) {
        background: #222;
        box-shadow: none;
        animation: none;
      }
      .terminal-title {
        color: var(--text-hacker);
        font-size: 1.05rem;
        font-weight: bold;
        margin-left: 10px;
        letter-spacing: 0.03em;
        text-shadow: 0 0 7px #00ff41cc;
        flex: 1;
      }
      @keyframes blink {
        0% {
          opacity: 0.7;
        }
        100% {
          opacity: 1;
        }
      }

      h1 {
        margin: 0 0 28px 0;
        font-size: 1.3rem;
        text-align: center;
        color: var(--text-hacker);
        letter-spacing: 0.08em;
        text-shadow: 0 0 12px #00ff41cc;
        border-bottom: 1.5px solid var(--border-hacker);
        padding-bottom: 10px;
        width: 100%;
        background: rgba(0, 255, 65, 0.03);
        border-radius: 0 0 6px 6px;
      }

      form {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 18px;
        margin-top: 0;
      }

      .form-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      label {
        color: var(--text-main);
        font-weight: 600;
        font-size: 1rem;
        margin-bottom: 3px;
        letter-spacing: 0.02em;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      label.required::after {
        content: ' *';
        color: var(--text-hacker);
        font-weight: bold;
        font-size: 1.1em;
      }

      input[type='text'],
      select {
        background: #181f18;
        color: var(--text-hacker);
        border: 2px solid var(--border-hacker);
        border-radius: var(--radius);
        padding: 10px 12px;
        font-size: 1rem;
        font-family: inherit;
        outline: none;
        box-shadow: 0 0 8px #00ff4144 inset;
        transition:
          border-color 0.16s,
          box-shadow 0.17s;
        margin-top: 2px;
      }
      input[type='text']:focus,
      select:focus {
        border-color: #00ff41;
        box-shadow:
          0 0 16px #00ff41cc,
          0 0 8px #00ff41 inset;
      }

      fieldset {
        border: 2px solid var(--border-hacker);
        border-radius: var(--radius);
        padding: 16px 14px 12px 14px;
        box-shadow: 0 0 8px #00ff4133 inset;
        margin: 0;
        margin-bottom: 0;
        background: rgba(0, 255, 65, 0.02);
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      legend {
        color: var(--text-hacker);
        font-weight: bold;
        font-size: 1.05rem;
        letter-spacing: 0.04em;
        text-shadow: 0 0 6px #00ff41cc;
        padding: 0 8px;
      }

      .checkbox-group {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 2px;
      }
      input[type='checkbox'] {
        accent-color: #00ff41;
        width: 18px;
        height: 18px;
        border-radius: 4px;
        border: 2px solid var(--border-hacker);
        background: #181f18;
      }

      button[type='submit'] {
        margin-top: 8px;
        width: 100%;
        padding: 14px 0;
        background: #050;
        color: var(--text-hacker);
        font-family: inherit;
        font-size: 1.08rem;
        font-weight: 700;
        border: 2.5px solid var(--border-hacker);
        border-radius: var(--radius);
        box-shadow:
          0 0 16px #00ff41cc,
          0 0 8px #00ff41 inset;
        letter-spacing: 0.05em;
        cursor: pointer;
        transition:
          background 0.15s,
          color 0.12s,
          box-shadow 0.17s,
          border-color 0.16s;
        text-shadow: 0 0 8px #00ff41cc;
      }
      button[type='submit']:hover,
      button[type='submit']:focus {
        background: #0a2f0a;
        color: #181;
        border-color: #00ff41;
        box-shadow:
          0 0 24px #00ff41cc,
          0 0 12px #00ff41 inset;
        outline: none;
      }

      @media (max-width: 600px) {
        .container {
          padding: 18px 3vw 14px 3vw;
          min-width: 0;
          max-width: 97vw;
        }
        h1 {
          font-size: 1.05rem;
          padding-bottom: 7px;
        }
        label,
        legend {
          font-size: 0.97rem;
        }
        button[type='submit'] {
          font-size: 0.97rem;
          padding: 10px 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="terminal-bar">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="terminal-title">openfinance@jojowam:~$</span>
      </div>
      <h1>CRIAR CONFIGURAÇÃO OPEN FINANCE</h1>
      <form id="create-config-form" autocomplete="off">
        <div class="form-group">
          <label class="required">
            Redirect URL:
            <input
              type="text"
              name="redirectURL"
              required
              autocomplete="off"
              placeholder="https://suaaplicacao.com/retorno"
            />
          </label>
        </div>
        <div class="form-group">
          <label class="required">
            Webhook URL:
            <input
              type="text"
              name="webhookURL"
              required
              autocomplete="off"
              placeholder="https://suaaplicacao.com/webhook"
            />
          </label>
        </div>
        <fieldset>
          <legend>Segurança do Webhook</legend>
          <label class="required">
            Tipo:
            <input type="text" name="webhookType" value="hmac" required autocomplete="off" />
          </label>
          <label class="required">
            Hash:
            <input
              type="text"
              name="webhookHash"
              autocomplete="off"
              placeholder="abc123def567ghi"
            />
          </label>
        </fieldset>
        <div class="form-group">
          <label>
            Process Payment:
            <select name="processPayment">
              <option value="async">async</option>
              <option value="sync">sync</option>
            </select>
          </label>
        </div>
        <div class="checkbox-group">
          <input type="checkbox" name="generateTxIdForInic" id="generateTxIdForInic" checked />
          <label for="generateTxIdForInic" style="margin: 0"
            >Gerar TxId para Iniciação de pagamentos?</label
          >
        </div>
        <button type="submit">Enviar</button>
      </form>
    </div>
    <script src="/js/create-configuration.js"></script>
  </body>
</html>
